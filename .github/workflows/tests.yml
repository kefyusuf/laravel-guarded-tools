name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  manifest:
    name: Package manifests agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - run: composer validate --strict
      - name: Root and package composer.json declare the same package
        run: |
          php -r '
            $root = json_decode(file_get_contents("composer.json"), true);
            $pkg = json_decode(file_get_contents("packages/guarded-tools/composer.json"), true);
            foreach (["name", "require", "suggest", "conflict", "extra"] as $key) {
                if (($root[$key] ?? null) !== ($pkg[$key] ?? null)) {
                    fwrite(STDERR, "Mismatch in {$key}\n");
                    exit(1);
                }
            }
            echo "Manifests agree\n";
          '

  apps:
    name: ${{ matrix.app }} (${{ matrix.db }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [demo-app, pilots/support-desk, pilots/clinic, pilots/inventory, pilots/agency-hours]
        db: [sqlite, mysql, pgsql]
        php: ['8.4']
        include:
          # Track B (plain laravel/ai, Laravel 12) also runs on the lowest supported PHP.
          - { app: pilots/agency-hours, db: sqlite, php: '8.3' }
          - { app: pilots/agency-hours, db: mysql, php: '8.3' }
          - { app: pilots/agency-hours, db: pgsql, php: '8.3' }
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: testing
          MYSQL_ROOT_PASSWORD: password
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -ppassword" --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports: ['5432:5432']
        options: --health-cmd=pg_isready --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_mysql, pdo_pgsql, intl
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - name: Point tests at ${{ matrix.db }}
        if: matrix.db != 'sqlite'
        run: |
          if [ "${{ matrix.db }}" = mysql ]; then port=3306; user=root; else port=5432; user=postgres; fi
          {
            echo "DB_CONNECTION=${{ matrix.db }}"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=$port"
            echo "DB_DATABASE=testing"
            echo "DB_USERNAME=$user"
            echo "DB_PASSWORD=password"
          } >> "$GITHUB_ENV"
      - run: php artisan test
