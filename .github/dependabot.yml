# Watch the packages the base class extends. A new release opens a pull
# request in every app, and CI tests it on SQLite, MySQL and PostgreSQL.
version: 2
updates:
  - package-ecosystem: composer
    directories:
      - /demo-app
      - /pilots/support-desk
      - /pilots/clinic
      - /pilots/inventory
      - /pilots/agency-hours
      - /pilots/neuron-tasks
      - /pilots/prism-tasks
    schedule:
      interval: daily
    allow:
      - dependency-name: packstub/agents
      - dependency-name: laravel/ai
      - dependency-name: laravel/mcp
      - dependency-name: neuron-core/neuron-ai
      - dependency-name: prism-php/prism
    groups:
      agent-stack:
        patterns: ["packstub/agents", "laravel/ai", "laravel/mcp", "neuron-core/neuron-ai", "prism-php/prism"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
