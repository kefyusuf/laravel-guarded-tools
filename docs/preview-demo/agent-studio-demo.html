<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Agent Studio — İnteraktif demo</title><style>
:root{--bg:#f5f7f9;--ink:#172638;--muted:#627185;--line:#e3e8ed;--green:#087f63;--soft:#eaf6f0;--red:#ad3340;--radius:10px}*{box-sizing:border-box}body{margin:0;font:14px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);border-radius:7px;padding:9px 15px}button:hover{border-color:var(--green)}button.primary{background:var(--green);color:white;border-color:var(--green)}button:disabled{opacity:.5;cursor:not-allowed}:focus-visible{outline:3px solid #77cbb7;outline-offset:2px}aside{position:fixed;inset:0 auto 0 0;width:230px;background:white;border-right:1px solid var(--line);padding:28px 18px;display:flex;flex-direction:column}.brand{font-size:22px;font-weight:750;letter-spacing:-.7px;padding:0 12px 25px}.brand span{color:var(--green)}nav{display:grid;gap:5px}nav button{display:flex;align-items:center;gap:13px;text-align:left;border:none;background:none;padding:11px 13px;color:var(--muted)}nav button.active{background:var(--soft);color:var(--green);font-weight:650}.sidefoot{margin-top:auto;padding:14px 12px;font-size:12px;color:var(--muted)}main{margin-left:230px}header{height:78px;border-bottom:1px solid var(--line);background:white;display:flex;align-items:center;justify-content:space-between;padding:0 38px;gap:15px}.actions{display:flex;align-items:center;gap:12px}.demo{color:var(--green);font-size:12px}.content{max-width:1350px;margin:auto;padding:40px}.heading{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-bottom:30px}h1{font-size:32px;line-height:1.2;letter-spacing:-1px;margin:0 0 12px}h2{font-size:18px;margin:0 0 18px}h3{font-size:16px;margin:0 0 10px}p{margin:8px 0 18px}.muted{color:var(--muted)}.stats{display:flex;border-block:1px solid var(--line);margin-bottom:32px;padding:22px 0}.stat{flex:1;border-right:1px solid var(--line);padding:0 24px}.stat:first-child{padding-left:0}.stat:last-child{border:0}.stat strong{font-size:27px;margin-right:12px}.grid{display:grid;grid-template-columns:1.8fr 1fr;gap:24px}.panel{min-width:0;background:white;border:1px solid var(--line);border-radius:var(--radius);padding:25px;margin-bottom:24px}.notice{background:var(--soft);border-left:3px solid var(--green);padding:19px 23px;border-radius:6px;margin-bottom:24px}.notice p{margin:4px 0}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left}th{font-weight:500;color:var(--muted);font-size:12px}th,td{padding:15px 10px;border-bottom:1px solid var(--line)}td:first-child,th:first-child{padding-left:0}td code{font-size:13px}code,pre{font-family:ui-monospace,Consolas,monospace}pre{background:#132536;color:#def4eb;padding:22px;border-radius:8px;white-space:pre-wrap;word-break:break-word;max-height:430px;overflow:auto}.tag{font-size:12px;padding:4px 8px;background:var(--soft);color:var(--green);border-radius:5px}.tag.bad{background:#fff0f1;color:var(--red)}.steps{list-style:none;padding:0;margin:0}.steps li{display:flex;gap:15px;padding:13px 0;border-bottom:1px solid var(--line)}.num{width:27px;height:27px;background:var(--soft);color:var(--green);border-radius:50%;text-align:center;flex-shrink:0}.steps small{display:block;color:var(--muted)}.formgrid{min-width:0;display:grid;grid-template-columns:1fr 1fr;gap:18px}label{min-width:0;display:block;font-size:13px;font-weight:600}input,select,textarea{display:block;width:100%;margin:7px 0 0;border:1px solid #ccd5de;border-radius:7px;padding:10px 12px;background:white;color:var(--ink)}textarea{min-height:95px;resize:vertical}.full{grid-column:1/-1}.checks{display:flex;flex-wrap:wrap;gap:20px;margin:16px 0}.checks label{display:flex;align-items:center;gap:8px}.checks input{width:auto;margin:0}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.foot{font-size:12px;color:var(--muted);margin-top:28px}.empty{padding:30px;text-align:center;color:var(--muted)}#toast{position:fixed;bottom:25px;right:25px;max-width:400px;background:var(--ink);color:white;padding:14px 20px;border-radius:8px;display:none;z-index:3}.trace{border-left:2px solid var(--line);padding:8px 18px;margin:12px 0}.trace b{display:block}.result{font-size:16px;background:var(--soft);padding:20px;border-radius:8px}.danger{color:var(--red)}details{padding:13px 0;border-bottom:1px solid var(--line)}summary{cursor:pointer;font-weight:600}@media(max-width:1000px){.grid{grid-template-columns:minmax(0,1fr)}.content{padding:28px}.heading{align-items:flex-start}h1{font-size:28px}}@media(max-width:700px){aside{position:static;width:100%;padding:16px}.brand{padding:0 0 12px}nav{display:flex;overflow:auto}nav button{white-space:nowrap}.sidefoot{display:none}main{margin:0}header{height:auto;padding:15px;flex-wrap:wrap}.content{padding:20px}.heading{display:block}.heading button{margin-top:10px}.formgrid{grid-template-columns:minmax(0,1fr)}.stat{padding:0 10px}.stat strong{display:block}h1{font-size:26px}#toast{left:15px;right:15px;bottom:15px}}
@media(min-width:1001px){aside{width:256px;margin:12px;border-radius:12px;border:0;height:calc(100vh - 24px);padding:18px 14px}main{margin-left:270px;margin-right:12px;margin-top:12px;background:white;min-height:calc(100vh - 24px);border-radius:12px}header{border-radius:12px 12px 0 0;padding:0 24px;height:68px}.content{padding:40px 24px 24px}h1{font-size:40px}.heading p{font-size:19px}.brand{white-space:nowrap;font-size:26px;padding:0 10px 26px}.stats{border:0;gap:16px;padding:0;margin-bottom:24px}.stat{border:1px solid var(--line)!important;border-radius:8px;padding:16px 22px!important}.stat strong{display:block;font-size:36px;line-height:1.35;margin:0 0 5px}.grid{grid-template-columns:1.75fr 1fr;gap:16px}.panel{padding:24px}#app>.grid>.panel{min-width:0}#app>.stats+.grid>.panel{min-height:460px}h2{font-size:23px}.steps li{padding:14px 0}.steps small{margin-top:6px;font-size:14px}.num{width:36px;height:36px;line-height:36px}.heading .primary{padding:14px 20px}.notice{border:1px solid #cce9df;border-radius:9px}.sidefoot{padding-bottom:0}}
</style></head><body><aside><div class="brand">Agent Studio</div><nav id="nav" aria-label="Ana gezinme"></nav><div class="sidefoot">Çalışma adı · marka kararı değil<br>SQLite varsayılan · Read-only V1<br>PRD v0.1 / 05.10.2026</div></aside><main><header><span id="crumb">Çalışma alanı / Genel bakış</span><div class="actions"><span class="demo">Demo · çevrimdışı</span><button id="export">JSON dışa aktar</button><button id="reset" title="Yerel demo verisini başlangıca döndür">Sıfırla</button></div></header><div class="content" id="app"></div></main><div id="toast" role="status" aria-live="polite"></div><script>
'use strict';
const KEY='agent-studio-demo-v1';const seed=()=>({installed:false,setup:{architecture:'Laravel monolith',runtime:'Ollama',model:'Yerel chat modeli',embedding:'Yerel embedding modeli'},agents:[{id:'agent-1',name:'Operasyon Asistanı',instructions:'Yalnızca izin verilen read-only tool’ları kullan. Sonuçları kaynağıyla açıkla.',tools:['orders.summary','content.search'],maxCalls:8,maxRounds:5,deadline:30,resultBytes:1048576}],tools:[{name:'orders.summary',description:'Dönemsel sipariş özeti',permission:'orders.read',hosts:['order.maindomain.com','admin.maindomain.com'],connector:'orders-api',enabled:true,inputSchema:{type:'object',properties:{period:{type:'string',enum:['last_month','this_month']}},required:['period'],additionalProperties:false}},{name:'content.search',description:'Yayınlanmış içerik arama',permission:'content.read',hosts:['blog.maindomain.com','admin.maindomain.com'],connector:'orders-api',enabled:true,inputSchema:{type:'object',properties:{query:{type:'string'}},required:['query'],additionalProperties:false}}],connectors:[{id:'orders-api',driver:'http',endpoints:['https://orders-1.example.test/api','https://orders-2.example.test/api'],secretRef:'ORDER_API_TOKEN',timeout:5}],memories:[{id:'mem-1',text:'Bu kullanıcı raporları aylık ister.',type:'Memory',scope:'user:7',status:'CANDIDATE',source:'conversation:demo',owner:'user:7',confidence:.7,expires:'2026-12-31'},{id:'know-1',text:'İptal edilmiş siparişler satış raporuna dahil edilmez.',type:'Knowledge',scope:'tenant:42',status:'ACTIVE',source:'policy:sales-v1',owner:'organization:42',confidence:1,expires:'2026-12-31'}],runs:[]});
let state=seed();try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.agents)&&Array.isArray(saved.tools)&&Array.isArray(saved.connectors)&&Array.isArray(saved.memories)&&Array.isArray(saved.runs))state=saved}catch(e){}let page='overview';let selectedRun=null;
const $=s=>document.querySelector(s);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pretty=x=>esc(JSON.stringify(x,null,2));
function notify(msg){$('#toast').textContent=msg;$('#toast').style.display='block';clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('#toast').style.display='none',3500)}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){notify('Tarayıcı kalıcı kayda izin vermiyor. JSON dışa aktar ile saklayabilirsin.')}}
const icons={overview:'M3 10 12 3l9 7v11h-6v-7H9v7H3z',setup:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M12 2v3 M12 19v3 M2 12h3 M19 12h3 M5 5l2 2 M17 17l2 2 M5 19l2-2 M17 7l2-2',agents:'M5 8h14v12H5z M12 3v5 M2 12h3 M19 12h3 M8 12h1 M15 12h1 M9 16h6',tools:'M14 3a6 6 0 0 0-7 7L3 14v7h7l4-4a6 6 0 0 0 7-7l-4 3-4-4 3-4z',connectors:'M7 3v5 M17 3v5 M5 8h14v4a7 7 0 0 1-14 0z M12 19v3',memory:'M4 5c0-4 16-4 16 0v14c0 4-16 4-16 0z M4 5c0 4 16 4 16 0 M4 12c0 4 16 4 16 0',play:'M5 3l15 9-15 9z',runs:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18 M12 6v6l4 3',review:'M5 3h14v18H5z M8 7h8 M8 11h8 M8 15h5'};
function icon(id){return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${icons[id]}"></path></svg>`}
const pages=[['overview','Genel bakış'],['setup','Kurulum'],['agents',"Agent’lar"],['tools',"Tool’lar"],['connectors',"Connector’lar"],['memory','Memory & Knowledge'],['play','Playground'],['runs','Çalıştırma geçmişi'],['review','PRD & İnceleme']];
function go(p){page=p;render();window.scrollTo(0,0)}function heading(title,desc,action=''){return `<div class="heading"><div><h1>${title}</h1><p class="muted">${desc}</p></div>${action}</div>`}function option(v,label=v){return `<option value="${esc(v)}">${esc(label)}</option>`}function toolTable(){return `<div class="tablewrap"><table><thead><tr><th>Tool</th><th>İzin</th><th>Connector</th><th>Durum</th></tr></thead><tbody>${state.tools.map(t=>`<tr><td><code>${esc(t.name)}</code><br><small class="muted">${esc(t.description)}</small></td><td>${esc(t.permission)}</td><td>${esc(t.connector)}</td><td><span class="tag ${t.enabled?'':'bad'}">${t.enabled?'Aktif':'Pasif'}</span></td></tr>`).join('')}</tbody></table></div>`}
function render(){ $('#nav').innerHTML=pages.map(([id,label])=>`<button data-page="${id}" class="${page===id?'active':''}" ${page===id?'aria-current="page"':''}>${icon(id)}${label}</button>`).join('');$('#crumb').textContent='Çalışma alanı / '+pages.find(x=>x[0]===page)[1];const app=$('#app');
if(page==='overview')app.innerHTML=heading('Uygulamanın verisini agent’a aç.','Tool, yetki ve bağlantıları tek çalışma alanında incele.','<button class="primary" data-page="play">Playground’u aç</button>')+`<div class="stats"><div class="stat"><strong>${state.agents.length}</strong>Agent</div><div class="stat"><strong>${state.tools.length}</strong>Tool</div><div class="stat"><strong>${state.connectors.length}</strong>Connector</div></div><div class="grid"><section class="panel"><h2>Kayıtlı tool’lar</h2>${toolTable()}</section><section class="panel"><h2>İlk çalışan döngü</h2><ol class="steps">${[['Kurulumu tamamla',state.installed?'Demo kurulumu hazır':'Runtime ve adapter seç'],['Agent tanımla','Talimat ve çalışma bütçesi'],['Tool bağla','İzin, host ve connector'],['Güvenli çalıştır','Kaynak ve policy kararını incele']].map((x,i)=>`<li><span class="num">${i+1}</span><div>${x[0]}<small>${x[1]}</small></div></li>`).join('')}</ol><button data-page="setup" style="margin-top:18px">Kuruluma git</button></section></div><div class="notice"><b>Simülasyon ortamı</b><p>Gerçek model, API veya veritabanı bağlantısı kurulmaz. Formlar, policy kuralları ve kayıtlar tarayıcıda çalışır. Hassas veri veya API anahtarı girme.</p></div><p class="foot">SQLite varsayılan · Read-only V1 · Panel inceleme aracıdır; ürün çekirdeği headless kalır.</p>`;
if(page==='setup')app.innerHTML=heading('İlk kurulum','Bir kurulum profili oluştur; demo ortamını hazırla.')+`<div class="grid"><section class="panel"><form id="setupForm"><div class="formgrid"><label>Uygulama mimarisi<select name="architecture">${['Laravel monolith','Laravel blog','API-first / microservice','Generic PHP'].map(x=>option(x)).join('')}</select></label><label>Yerel runtime<select name="runtime">${['Ollama','LM Studio','llama.cpp'].map(x=>option(x)).join('')}</select></label><label>Chat modeli<input name="model" required value="${esc(state.setup.model)}"></label><label>Embedding modeli<input name="embedding" required value="${esc(state.setup.embedding)}"></label></div><p class="muted">Modeller ve runtime sürümleri bu demoda doğrulanmaz. SQLite, agent verisidir; uygulamanın veritabanını değiştirmez.</p><button class="primary">Demo kurulumu tamamla</button></form></section><section class="panel"><h2>Hazırlık durumu</h2><div id="checks">${state.installed?'✓ Demo profili hazır<br>✓ Simüle SQLite şeması<br>✓ Fake model hazır':'Henüz demo kurulumu tamamlanmadı.'}</div><h3 style="margin-top:20px">Önerilen gerçek akış</h3><p class="muted">Paket → config → migration → model bağlantı testi → read-only tool → ilk doğrulanmış yanıt.</p><p>Bu ekran paket indirmez veya komut çalıştırmaz.</p></section></div>`;
if(page==='agents')app.innerHTML=heading('Agent’lar','Görev, erişilebilir tool’lar ve çalışma sınırları.')+`<section class="panel"><h2>Yeni agent</h2><form id="agentForm"><div class="formgrid"><label>Ad<input name="name" required maxlength="80" placeholder="Satış Asistanı"></label><label>Maksimum tool çağrısı<input name="maxCalls" type="number" min="1" max="16" value="8" required></label><label class="full">Sistem talimatı<textarea name="instructions" required>Yalnızca izin verilen tool’ları kullan; sonuçları kaynağıyla açıkla.</textarea></label></div><div class="checks">${state.tools.map(t=>`<label><input type="checkbox" name="tools" value="${esc(t.name)}" checked>${esc(t.name)}</label>`).join('')}</div><button class="primary">Agent oluştur</button></form></section>${state.agents.map(a=>`<section class="panel"><h2>${esc(a.name)}</h2><p>${esc(a.instructions)}</p><p><code>${esc(a.tools.join(' · '))}</code></p><span class="tag">${a.maxCalls} tool / ${a.maxRounds} tur / ${a.deadline} sn</span></section>`).join('')}`;
if(page==='tools')app.innerHTML=heading('Tool’lar','Capability tanımı, request host ve execution yetkisi.')+`<section class="panel"><h2>Tool kaydet</h2><form id="toolForm"><div class="formgrid"><label>Namespace<input name="name" required pattern="[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+" placeholder="orders.search"></label><label>Gerekli izin<input name="permission" required placeholder="orders.read"></label><label>Connector<select name="connector">${state.connectors.map(c=>option(c.id)).join('')}</select></label><label>Request host’lar (virgülle)<input name="hosts" required value="order.maindomain.com, admin.maindomain.com"></label><label class="full">Açıklama<input name="description" required placeholder="Siparişleri filtreleyerek ara"></label><label class="full">Input schema (JSON)<textarea name="schema" required>{"type":"object","properties":{"query":{"type":"string"}},"required":["query"],"additionalProperties":false}</textarea></label></div><p class="muted">V1 READ. Tool kodu oluşturulmaz; bu kayıt yalnızca tanım ve fixture sonucudur. Host, kimlik doğrulamanın yerine geçmez.</p><button class="primary">Tool kaydet</button></form></section><section class="panel">${toolTable()}<div class="row" style="margin-top:18px">${state.tools.map((t,i)=>`<button data-toggle="${i}">${esc(t.name)} · ${t.enabled?'Pasifleştir':'Aktifleştir'}</button>`).join('')}</div></section>`;
if(page==='connectors')app.innerHTML=heading('Connector’lar','Gelen request_host ve giden endpoint birbirinden bağımsızdır.')+`<section class="panel"><form id="connectorForm"><div class="formgrid"><label>Connector ID<input name="id" required pattern="[a-z][a-z0-9_\-]*" placeholder="content-api"></label><label>Driver<select name="driver">${option('http','HTTP')}${option('laravel','Local Laravel')}</select></label><label class="full">Endpoint’ler — her satır bir HTTPS URL<textarea name="endpoints" required>https://content.example.test/api</textarea></label><label>Secret referansı (değer değil)<input name="secretRef" required placeholder="CONTENT_API_TOKEN"></label><label>Timeout (saniye)<input name="timeout" type="number" min="1" max="30" value="5" required></label></div><p class="muted">İlk satır primary, sonraki satır read-only backup. Local Laravel için URL alanı kullanılmaz. Secret değerleri tutulmaz.</p><button class="primary">Connector oluştur</button></form></section>${state.connectors.map(c=>`<section class="panel"><h2>${esc(c.id)} <span class="tag">${esc(c.driver)}</span></h2><p>${c.endpoints.map((e,i)=>`<code>${esc(e)}</code> · ${i===0?'primary':'backup'}<br>`).join('')||'Uygulama portu / dependency injection'}</p><p class="muted">Credential reference: ${esc(c.secretRef)} · timeout ${c.timeout}s</p></section>`).join('')}`;
if(page==='memory')app.innerHTML=heading('Memory & Knowledge','Kullanıcı gözlemi otomatik olarak şirket kuralına dönüşmez.')+`<div class="notice"><b>Scope ile ayrılmış retrieval</b><p>Playground yalnızca ACTIVE, süresi dolmamış tenant:42 ve user:7 kayıtlarını kullanır. VALIDATED tek başına retrieval’a girmez.</p></div><section class="panel"><form id="memoryForm"><div class="formgrid"><label>Tür<select name="type">${option('Memory')}${option('Knowledge')}</select></label><label>Scope<select name="scope">${option('user:7')}${option('tenant:42')}${option('tenant:99')}</select></label><label class="full">İçerik<textarea name="text" required></textarea></label></div><p class="muted">Kaynak: demo:manual · sahibi: admin:demo · güven: inceleme bekliyor. Kaydın ömrü 90 gündür.</p><button class="primary">Candidate oluştur</button></form></section>${state.memories.map((m,i)=>`<section class="panel"><div class="row"><h2>${esc(m.type)}</h2><span class="tag ${m.status==='ACTIVE'?'':'bad'}">${esc(m.status)}</span></div><p>${esc(m.text)}</p><p class="muted">${esc(m.scope)} · ${esc(m.source)} · ${esc(m.owner)} · confidence ${m.confidence} · expires ${esc(m.expires)}</p><div class="row">${m.status==='CANDIDATE'?`<button data-memory="${i}" data-status="VALIDATED">Doğrula</button>`:''}${m.status==='VALIDATED'?`<button class="primary" data-memory="${i}" data-status="ACTIVE">Onayla ve aktive et</button>`:''}${['CANDIDATE','VALIDATED'].includes(m.status)?`<button data-memory="${i}" data-status="REJECTED">Reddet</button>`:''}${m.status==='ACTIVE'?`<button data-memory="${i}" data-status="EXPIRED">Süresini bitir</button>`:''}</div></section>`).join('')}`;
if(page==='play')app.innerHTML=heading('Playground','Bir isteğin neden çalıştığını veya reddedildiğini izle.')+`<div class="grid"><section class="panel"><form id="playForm"><div class="formgrid"><label>Agent<select name="agent">${state.agents.map(a=>option(a.id,a.name)).join('')}</select></label><label>Request host<select name="host">${['order.maindomain.com','blog.maindomain.com','admin.maindomain.com','evil.example.test'].map(x=>option(x)).join('')}</select></label><label>Kimlik<select name="identity">${option('user:7','Doğrulanmış user:7')}${option('anonymous','Anonim')}</select></label><label>Scope<select name="scope">${option('tenant:42')}${option('tenant:99')}</select></label><label class="full">Seçilecek tool (fake model)<select name="tool">${state.tools.map(t=>option(t.name)).join('')}</select></label><label class="full">Tool argümanları (JSON)<textarea id="args" name="args">{"period":"last_month"}</textarea></label><label class="full">Kullanıcı mesajı<textarea name="message" required>Geçen ay kaç sipariş verdik?</textarea></label></div><div class="checks"><label><input name="permission" type="checkbox" checked>Gerekli izin var</label><label><input name="primaryDown" type="checkbox">Primary unavailable</label><label><input name="allDown" type="checkbox">Tüm endpoint’ler unavailable</label></div><p class="muted">Görünür tool’lar: <span id="visible"></span></p><button class="primary">Simülasyonu çalıştır</button></form></section><section class="panel"><h2>Sonuç & execution trace</h2><div id="result"><p class="muted">Henüz çalıştırma yok. Başarılı çağrı, yanlış host, eksik izin ve failover senaryolarını karşılaştır.</p></div></section></div>`;
if(page==='runs')app.innerHTML=heading('Çalıştırma geçmişi','Simüle execution evidence ve kaynak bağlantıları.')+`<section class="panel">${state.runs.length?`<div class="tablewrap"><table><thead><tr><th>Run</th><th>Tool</th><th>Karar</th><th>Zaman</th><th></th></tr></thead><tbody>${state.runs.slice().reverse().map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(r.tool)}</td><td><span class="tag ${r.status==='success'?'':'bad'}">${esc(r.status)}</span></td><td>${esc(new Date(r.at).toLocaleString('tr-TR'))}</td><td><button data-run="${esc(r.id)}">İncele</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Henüz kayıt yok. Playground’da bir senaryo çalıştır.</div>'}</section><section id="runDetail">${selectedRun?`<pre>${pretty(selectedRun)}</pre>`:''}</section>`;
if(page==='review')app.innerHTML=heading('PRD & İnceleme','Mimari discovery’yi kapat; küçük çalışan döngüyü doğrula.')+`<section class="panel"><h2>Ürün sınırı</h2><p>Laravel-first, framework-independent PHP core. Uygulama entegrasyonu tools + application ports + connectors üzerinden. Core headless; bu panel ürünün zorunlu runtime’ı değildir.</p><details open><summary>MVP — ilk doğrulanmış döngü</summary><p>Bir Laravel örneği, bir read-only tool, fake model ve bir local model gateway, execution policy, scope, budget, SQLite conversation/run kaydı.</p></details><details><summary>V1 tamamlayıcı kapsam</summary><p>Knowledge ingestion, versioned embedding, scope-filtered semantic retrieval, kontrollü memory promotion, HTTP connector, bounded priority failover, headless endpoint.</p></details><details><summary>Sonraya bırakılanlar</summary><p>Builder, otomatik tool üretimi, arbitrary SQL, multi-agent, discovery, load balancing, distributed memory, fine-tuning, model marketplace.</p></details><details open><summary>Claude ile sorgulanacak varsayımlar</summary><p>İlk müşteri kim? Semantic retrieval ilk pilotta şart mı? Connector public contract olmalı mı? JSON fallback yerine native tool calling şartı daha küçük mü? Panel ayrı optional devtool olarak kalmalı mı?</p></details></section><div class="notice"><b>Demoda neler gerçek?</b><p>Formlar, kayıtlar, visibility/policy simülasyonu, schema alt kümesi kontrolü, scope filtresi, trace ve JSON export. Model inference, HTTP çağrısı, SQLite, embedding ve gerçek authorization yoktur.</p></div>`;
bind();}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{state.tools[+b.dataset.toggle].enabled=!state.tools[+b.dataset.toggle].enabled;save();render()});document.querySelectorAll('[data-memory]').forEach(b=>b.onclick=()=>{const m=state.memories[+b.dataset.memory];m.status=b.dataset.status;m.approval={actor:'admin:demo',at:new Date().toISOString()};save();render()});document.querySelectorAll('[data-run]').forEach(b=>b.onclick=()=>{selectedRun=state.runs.find(r=>r.id===b.dataset.run);render()});
if($('#setupForm')){const f=$('#setupForm');f.architecture.value=state.setup.architecture;f.runtime.value=state.setup.runtime;f.onsubmit=e=>{e.preventDefault();state.setup=Object.fromEntries(new FormData(f));state.installed=true;save();render();notify('Demo kurulumu hazır. Gerçek bağlantı kurulmadı.')}}
if($('#agentForm'))$('#agentForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const tools=f.getAll('tools');if(!tools.length)return notify('En az bir tool seç.');state.agents.push({id:'agent-'+Date.now(),name:f.get('name'),instructions:f.get('instructions'),tools,maxCalls:+f.get('maxCalls'),maxRounds:5,deadline:30,resultBytes:1048576});save();render();notify('Agent oluşturuldu.')};
if($('#toolForm'))$('#toolForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);if(state.tools.some(t=>t.name===f.get('name')))return notify('Bu tool adı zaten kayıtlı.');let schema;try{schema=JSON.parse(f.get('schema'));if(schema.type!=='object'||!schema.properties||Object.values(schema.properties).some(p=>!['string','number','integer','boolean'].includes(p.type))||(schema.required||[]).some(k=>!schema.properties[k]))throw Error()}catch(err){return notify('Object schema ve string/number/integer/boolean alanları kullan. Required alanları properties içinde olmalı.')}const hosts=f.get('hosts').split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);if(hosts.some(h=>!/^[a-z0-9]+(?:[.-][a-z0-9]+)*$/.test(h)))return notify('Tam host adı gir; protokol, path ve wildcard kullanma.');state.tools.push({name:f.get('name'),description:f.get('description'),permission:f.get('permission'),hosts,connector:f.get('connector'),enabled:true,inputSchema:schema});save();render();notify('Read-only tool tanımı kaydedildi.')};
if($('#connectorForm')){const f=$('#connectorForm');f.driver.onchange=()=>{f.endpoints.required=f.driver.value==='http';f.endpoints.disabled=f.driver.value!=='http'};f.onsubmit=e=>{e.preventDefault();const d=new FormData(f);if(state.connectors.some(c=>c.id===d.get('id')))return notify('Bu connector ID zaten var.');let endpoints=d.get('driver')==='http'?String(d.get('endpoints')).split(/\n/).map(x=>x.trim()).filter(Boolean):[];try{endpoints.forEach(x=>{const u=new URL(x);if(u.protocol!=='https:'||u.username||u.password)throw Error()});if(d.get('driver')==='http'&&!endpoints.length)throw Error()}catch(err){return notify('Credentials içermeyen geçerli HTTPS endpoint gir.')}state.connectors.push({id:d.get('id'),driver:d.get('driver'),endpoints,secretRef:d.get('secretRef'),timeout:+d.get('timeout')});save();render();notify('Connector tanımı kaydedildi; bağlantı kurulmadı.')}}
if($('#memoryForm'))$('#memoryForm').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target);state.memories.push({id:'mem-'+Date.now(),text:d.get('text'),type:d.get('type'),scope:d.get('scope'),status:'CANDIDATE',source:'demo:manual',owner:'admin:demo',confidence:0,expires:new Date(Date.now()+90*86400000).toISOString().slice(0,10)});save();render()};
if($('#playForm')){const f=$('#playForm');const visible=()=>{const a=state.agents.find(a=>a.id===f.agent.value);$('#visible').textContent=state.tools.filter(t=>t.enabled&&a.tools.includes(t.name)&&t.hosts.includes(f.host.value)&&f.identity.value!=='anonymous'&&f.permission.checked).map(t=>t.name).join(', ')||'Yok';};f.onchange=visible;f.tool.onchange=()=>{const t=state.tools.find(t=>t.name===f.tool.value);f.args.value=JSON.stringify(Object.fromEntries(Object.entries(t.inputSchema.properties).map(([k,v])=>[k,v.enum?.[0]??(v.type==='string'?'demo':v.type==='boolean'?true:1)])));visible()};visible();f.onsubmit=run;}}
function validate(schema,args){if(!args||typeof args!=='object'||Array.isArray(args))return false;if((schema.required||[]).some(k=>!(k in args)))return false;return Object.entries(args).every(([k,v])=>{const p=schema.properties[k];if(!p)return schema.additionalProperties!==false;return (p.type==='integer'?Number.isInteger(v):typeof v===p.type)&&(!p.enum||p.enum.includes(v))})}
function run(e){e.preventDefault();const f=e.target;const d=new FormData(f);const a=state.agents.find(a=>a.id===d.get('agent'));const t=state.tools.find(t=>t.name===d.get('tool'));const c=state.connectors.find(c=>c.id===t.connector);const trace=[];const add=(event,detail)=>trace.push({event,detail});let status='success',error=null,endpoint=null,args;add('agent.started',a.name);if(!state.installed){error='SetupRequired'}else if(d.get('identity')==='anonymous'){error='Unauthenticated'}else if(!t.enabled||!a.tools.includes(t.name)||!t.hosts.includes(d.get('host'))){error='ToolNotAvailable'}else if(!d.has('permission')){error='ToolDenied'}else if(d.get('scope')!=='tenant:42'){error='ScopeDenied'}else{add('tool.exposed',t.name);add('model.responded','Fake model — kullanıcı mesajından çıkarım yapılmaz');try{args=JSON.parse(d.get('args'));if(!validate(t.inputSchema,args))error='InvalidToolArguments'}catch(err){error='InvalidToolArguments'}}
if(!error){add('policy.allowed','Kimlik + host + izin + scope kontrolü');if(a.maxCalls<1||a.maxRounds<1)error='BudgetExceeded';else if(!c)error='ConnectorUnavailable';else if(d.has('allDown'))error='ConnectorUnavailable';else if(c.driver==='http'){endpoint=c.endpoints[0];if(d.has('primaryDown')){add('connector.failed','Primary unavailable (simüle)');endpoint=c.endpoints[1];if(!endpoint)error='ConnectorUnavailable';else add('connector.failover',endpoint)}}else endpoint='local:application-port'}
let data=null;if(!error){add('tool.started',t.name);data=t.name==='orders.summary'?{period:args.period,count:128,total_try:84250,excluded_cancelled:true}:t.name==='content.search'?{items:[{id:1,title:'Örnek yayınlanmış içerik',query:args.query}]}:{fixture:true,arguments:args,note:'Yeni tool için örnek sonuç; business logic çalışmadı.'};const bytes=new TextEncoder().encode(JSON.stringify(data)).length;if(bytes>a.resultBytes)error='ResultTooLarge';else add('tool.completed',bytes+' bytes — fixture')}
const memory=!error?state.memories.filter(m=>m.status==='ACTIVE'&&[d.get('scope'),'user:7'].includes(m.scope)&&m.expires>=new Date().toISOString().slice(0,10)):[];if(!error)add('memory.retrieved',memory.length+' aktif ve kapsam içi kayıt (vektör araması yok)');if(error){data=null;status='error';add('agent.failed',error)}else add('agent.completed','Kaynaklı örnek yanıt');const r={id:'run-'+Date.now(),at:new Date().toISOString(),status,error,agent:a.id,tool:t.name,requestHost:d.get('host'),scope:d.get('scope'),message:d.get('message'),args,endpoint,data,memoryIds:memory.map(m=>m.id),trace,provenance:{simulation:true,connector:c?.id,source:endpoint,tool:t.name},budget:{toolCalls:trace.some(t=>t.event==='tool.started')?1:0,modelRounds:trace.some(t=>t.event==='model.responded')?1:0,limits:{maxCalls:a.maxCalls,maxRounds:a.maxRounds,deadline:a.deadline,resultBytes:a.resultBytes}}};state.runs.push(r);save();$('#result').innerHTML=`<div class="result ${error?'danger':''}">${error?esc(error)+' — işlem yapılmadı.':t.name==='orders.summary'?'Örnek veri: '+esc(args.period)+' döneminde 128 sipariş, 84.250 TL. İptal edilenler hariç.':'Fixture sonuç hazır; aşağıdaki veriyi incele.'}</div>${trace.map(x=>`<div class="trace"><b>${esc(x.event)}</b><small>${esc(x.detail)}</small></div>`).join('')}<pre>${pretty(r)}</pre>`;}
$('#export').onclick=()=>{const blob=new Blob([JSON.stringify({demo:true,version:'0.1',exportedAt:new Date().toISOString(),...state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='agent-studio-demo-config.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Demo yapılandırması dışa aktarıldı.')};$('#reset').onclick=()=>{if(confirm('Yerel demo kayıtları sıfırlansın mı?')){state=seed();selectedRun=null;save();render()}};render();
</script></body></html>
